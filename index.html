<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box-Counting Fractal Dimension Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #080b14; }
  input[type=range] { accent-color: #38bdf8; }
  select { background: #0f172a; color: #bae6fd; border: 1px solid #0369a1; }
  #dimChart { background: #0a0f1e; border: 1px solid #1e3a5f; border-radius: 6px; }
</style>
</head>
<body class="text-sky-100 min-h-screen flex flex-col">

<header class="px-4 py-3 bg-slate-900/90 border-b border-sky-900/50">
  <h1 class="text-xl font-bold text-sky-300">Box-Counting Fractal Dimension Explorer</h1>
  <p class="text-xs text-sky-500 mt-0.5">Hausdorff/Minkowski dimension via box-counting algorithm</p>
</header>

<div class="flex flex-col lg:flex-row flex-1 gap-0">

  <!-- Main canvas -->
  <div class="flex-1 relative min-h-[500px] flex flex-col">
    <canvas id="fractalCanvas" class="flex-1 w-full" role="img" aria-label="Fractal drawing canvas"></canvas>
  </div>

  <!-- Side panel -->
  <aside class="lg:w-72 bg-slate-900/70 border-l border-sky-900/40 p-4 flex flex-col gap-4" aria-label="Controls and analysis">

    <!-- Controls -->
    <section aria-labelledby="ctrlHeading">
      <h2 id="ctrlHeading" class="text-xs uppercase tracking-wider text-sky-500 mb-3">Controls</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-sky-400 mb-1" for="fractalSelect">Fractal Type</label>
          <select id="fractalSelect" class="w-full rounded px-2 py-1.5 text-sm" aria-label="Select fractal type">
            <option value="koch">Koch Snowflake  (D ≈ 1.2619)</option>
            <option value="sierpinski">Sierpiński Triangle (D ≈ 1.5850)</option>
            <option value="cantor">Cantor Dust 2D (D ≈ 1.2619)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-sky-400 mb-1" for="iterSlider">Iteration Depth: <span id="iterVal">4</span></label>
          <input type="range" id="iterSlider" min="2" max="6" value="4" class="w-full"
                 aria-label="Iteration depth" aria-valuemin="2" aria-valuemax="6">
        </div>

        <div class="flex gap-2">
          <button id="gridToggle"
            class="flex-1 py-1.5 rounded text-xs font-semibold bg-sky-800 hover:bg-sky-700 transition-colors"
            aria-pressed="false" aria-label="Toggle box-count grid overlay">
            Show Grid
          </button>
          <button id="redrawBtn"
            class="flex-1 py-1.5 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 transition-colors"
            aria-label="Redraw fractal">
            Redraw
          </button>
        </div>
      </div>
    </section>

    <!-- Dimension display -->
    <section class="bg-sky-950/60 rounded-lg p-3" aria-labelledby="dimHeading">
      <h2 id="dimHeading" class="text-xs uppercase tracking-wider text-sky-500 mb-2">Dimension Estimate</h2>
      <div class="flex justify-between items-center">
        <span class="text-xs text-sky-400">Computed D =</span>
        <span id="dimEstimate" class="text-2xl font-bold text-sky-300 font-mono">—</span>
      </div>
      <div class="flex justify-between items-center mt-1">
        <span class="text-xs text-sky-400">Theoretical D =</span>
        <span id="dimTheory" class="text-lg font-semibold text-emerald-400 font-mono">—</span>
      </div>
      <div class="flex justify-between items-center mt-1">
        <span class="text-xs text-sky-400">Error =</span>
        <span id="dimError" class="text-sm font-mono text-amber-400">—</span>
      </div>
    </section>

    <!-- N(ε) table -->
    <section aria-labelledby="tableHeading" class="flex-1 overflow-auto">
      <h2 id="tableHeading" class="text-xs uppercase tracking-wider text-sky-500 mb-2">N(ε) Table</h2>
      <table class="w-full text-xs font-mono" aria-label="Box count table">
        <thead>
          <tr class="text-sky-500 border-b border-sky-900">
            <th class="text-left py-1">ε (box size)</th>
            <th class="text-right py-1">N(ε)</th>
            <th class="text-right py-1">log(1/ε)</th>
            <th class="text-right py-1">log N</th>
          </tr>
        </thead>
        <tbody id="boxTable" class="text-sky-300"></tbody>
      </table>
    </section>

    <!-- Mini chart -->
    <canvas id="dimChart" width="240" height="140" aria-label="Log-log dimension plot" role="img"></canvas>
  </aside>
</div>

<script>
const canvas = document.getElementById('fractalCanvas');
const ctx = canvas.getContext('2d');
const chartCanvas = document.getElementById('dimChart');
const chartCtx = chartCanvas.getContext('2d');

let currentFractal = 'koch';
let iterDepth = 4;
let showGrid = false;
let currentGridSize = 0;

// ─── Fractal Generators ───────────────────────────────────────────
function kochSnowflake(depth) {
  // Returns array of line segments {x1,y1,x2,y2}
  function kochSegment(x1, y1, x2, y2, d) {
    if (d === 0) return [{ x1, y1, x2, y2 }];
    const dx = x2 - x1, dy = y2 - y1;
    const ax = x1 + dx/3, ay = y1 + dy/3;
    const bx = x1 + 2*dx/3, by = y1 + 2*dy/3;
    const angle = Math.atan2(dy, dx) - Math.PI/3;
    const len = Math.hypot(dx, dy) / 3;
    const px = ax + Math.cos(angle)*len, py = ay + Math.sin(angle)*len;
    return [
      ...kochSegment(x1, y1, ax, ay, d-1),
      ...kochSegment(ax, ay, px, py, d-1),
      ...kochSegment(px, py, bx, by, d-1),
      ...kochSegment(bx, by, x2, y2, d-1)
    ];
  }
  const W = canvas.width, H = canvas.height;
  const size = Math.min(W, H) * 0.72;
  const cx = W / 2, cy = H * 0.52;
  const r = size / Math.sqrt(3);
  const p1 = [cx, cy - r];
  const p2 = [cx - size/2, cy + r/2];
  const p3 = [cx + size/2, cy + r/2];
  return [
    ...kochSegment(...p1, ...p2, depth),
    ...kochSegment(...p2, ...p3, depth),
    ...kochSegment(...p3, ...p1, depth)
  ];
}

function sierpinskiTriangle(depth) {
  // Returns filled triangles {x1,y1,x2,y2,x3,y3}
  const segments = [];
  const W = canvas.width, H = canvas.height;
  const size = Math.min(W, H) * 0.82;
  const cx = W/2;
  const top = [cx, (H - size*0.866)/2 + 20];
  const left = [cx - size/2, top[1] + size*0.866];
  const right = [cx + size/2, top[1] + size*0.866];

  function subdiv(ax, ay, bx, by, cx2, cy2, d) {
    if (d === 0) {
      segments.push({ x1:ax,y1:ay, x2:bx,y2:by, x3:cx2,y3:cy2 });
      return;
    }
    const mx1 = (ax+bx)/2, my1 = (ay+by)/2;
    const mx2 = (bx+cx2)/2, my2 = (by+cy2)/2;
    const mx3 = (ax+cx2)/2, my3 = (ay+cy2)/2;
    subdiv(ax, ay, mx1, my1, mx3, my3, d-1);
    subdiv(mx1, my1, bx, by, mx2, my2, d-1);
    subdiv(mx3, my3, mx2, my2, cx2, cy2, d-1);
  }
  subdiv(...top, ...left, ...right, depth);
  return segments;
}

function cantorDust(depth) {
  // 2D Cantor dust: iteratively remove middle 1/3 in x and y
  // Returns array of filled rects {x,y,w,h}
  const W = canvas.width, H = canvas.height;
  const size = Math.min(W, H) * 0.80;
  const ox = (W - size) / 2;
  const oy = (H - size) / 2;
  const rects = [];

  function subdiv(x, y, w, h, d) {
    if (d === 0) {
      rects.push({ x, y, w, h });
      return;
    }
    const w3 = w / 3, h3 = h / 3;
    for (let ix = 0; ix < 3; ix++) {
      for (let iy = 0; iy < 3; iy++) {
        if (ix === 1 || iy === 1) continue; // remove center cross
        subdiv(x + ix*w3, y + iy*h3, w3, h3, d-1);
      }
    }
  }
  subdiv(ox, oy, size, size, depth);
  return rects;
}

// ─── Drawing ─────────────────────────────────────────────────────
function drawFractal() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050810';
  ctx.fillRect(0, 0, W, H);

  if (currentFractal === 'koch') {
    const segs = kochSnowflake(iterDepth);
    ctx.beginPath();
    for (const s of segs) {
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
    }
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1;
    ctx.stroke();
  } else if (currentFractal === 'sierpinski') {
    const tris = sierpinskiTriangle(iterDepth);
    for (let i = 0; i < tris.length; i++) {
      const t = tris[i];
      const hue = 180 + (i / tris.length) * 60;
      ctx.beginPath();
      ctx.moveTo(t.x1, t.y1);
      ctx.lineTo(t.x2, t.y2);
      ctx.lineTo(t.x3, t.y3);
      ctx.closePath();
      ctx.fillStyle = `hsl(${hue},80%,55%)`;
      ctx.fill();
    }
  } else {
    const rects = cantorDust(iterDepth);
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      const t = i / rects.length;
      ctx.fillStyle = `hsl(${200 + t*80},75%,${50+t*20}%)`;
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }
  }
}

// ─── Box counting ─────────────────────────────────────────────────
function boxCount(epsilon) {
  // Count non-empty boxes by sampling the fractal onto an offscreen canvas
  const W = canvas.width, H = canvas.height;
  const offscreen = document.createElement('canvas');
  offscreen.width = W; offscreen.height = H;
  const oc = offscreen.getContext('2d');
  oc.fillStyle = '#000';
  oc.fillRect(0, 0, W, H);

  if (currentFractal === 'koch') {
    const segs = kochSnowflake(iterDepth);
    oc.beginPath();
    for (const s of segs) { oc.moveTo(s.x1, s.y1); oc.lineTo(s.x2, s.y2); }
    oc.strokeStyle = '#fff';
    oc.lineWidth = 1.5;
    oc.stroke();
  } else if (currentFractal === 'sierpinski') {
    const tris = sierpinskiTriangle(iterDepth);
    for (const t of tris) {
      oc.beginPath();
      oc.moveTo(t.x1, t.y1); oc.lineTo(t.x2, t.y2); oc.lineTo(t.x3, t.y3);
      oc.closePath();
      oc.fillStyle = '#fff';
      oc.fill();
    }
  } else {
    const rects = cantorDust(iterDepth);
    for (const r of rects) { oc.fillStyle='#fff'; oc.fillRect(r.x,r.y,r.w,r.h); }
  }

  const data = oc.getImageData(0, 0, W, H).data;
  const cols = Math.ceil(W / epsilon);
  const rows = Math.ceil(H / epsilon);
  let count = 0;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      let found = false;
      const x0 = col * epsilon, y0 = row * epsilon;
      const x1 = Math.min(x0 + epsilon, W);
      const y1 = Math.min(y0 + epsilon, H);
      outer:
      for (let y = Math.floor(y0); y < Math.ceil(y1) && !found; y++) {
        for (let x = Math.floor(x0); x < Math.ceil(x1) && !found; x++) {
          if (data[(y * W + x) * 4] > 10) { found = true; }
        }
      }
      if (found) count++;
    }
  }
  return count;
}

function computeDimension() {
  const epsilons = [8, 16, 32, 64];
  const results = epsilons.map(eps => {
    const N = boxCount(eps);
    return { eps, N, logInvEps: Math.log(1/eps), logN: Math.log(N) };
  });

  // Linear regression on log-log
  const xs = results.map(r => r.logInvEps);
  const ys = results.map(r => r.logN);
  const n = xs.length;
  const sumX = xs.reduce((a,b)=>a+b,0);
  const sumY = ys.reduce((a,b)=>a+b,0);
  const sumXY = xs.reduce((a,r,i)=>a+r*ys[i],0);
  const sumX2 = xs.reduce((a,r)=>a+r*r,0);
  const slope = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);

  return { slope, results };
}

const THEORETICAL = { koch: 1.2619, sierpinski: 1.5850, cantor: 1.2619 };

function updateAnalysis() {
  const { slope, results } = computeDimension();
  const theory = THEORETICAL[currentFractal];

  document.getElementById('dimEstimate').textContent = slope.toFixed(4);
  document.getElementById('dimTheory').textContent = theory.toFixed(4);
  document.getElementById('dimError').textContent =
    ((Math.abs(slope - theory)/theory)*100).toFixed(2) + '%';

  // Update table
  const tbody = document.getElementById('boxTable');
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
  for (const r of results) {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-sky-900/30';
    [r.eps.toString(), r.N.toLocaleString(),
     r.logInvEps.toFixed(3), r.logN.toFixed(3)].forEach((val, i) => {
      const td = document.createElement('td');
      td.className = i === 0 ? 'py-1' : 'py-1 text-right';
      td.textContent = val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }

  drawChart(results, slope);
}

function drawChart(results, slope) {
  const cw = chartCanvas.width, ch = chartCanvas.height;
  chartCtx.fillStyle = '#0a0f1e';
  chartCtx.fillRect(0, 0, cw, ch);

  const pad = { l: 36, r: 10, t: 10, b: 28 };
  const xs = results.map(r => r.logInvEps);
  const ys = results.map(r => r.logN);
  const xMin = Math.min(...xs) - 0.2, xMax = Math.max(...xs) + 0.2;
  const yMin = Math.min(...ys) - 0.5, yMax = Math.max(...ys) + 0.5;

  function toScreen(lx, ly) {
    return {
      x: pad.l + (lx - xMin)/(xMax - xMin) * (cw - pad.l - pad.r),
      y: ch - pad.b - (ly - yMin)/(yMax - yMin) * (ch - pad.t - pad.b)
    };
  }

  // Axes
  chartCtx.strokeStyle = '#1e3a5f';
  chartCtx.lineWidth = 1;
  chartCtx.beginPath();
  chartCtx.moveTo(pad.l, pad.t); chartCtx.lineTo(pad.l, ch-pad.b);
  chartCtx.lineTo(cw-pad.r, ch-pad.b);
  chartCtx.stroke();

  // Fit line
  chartCtx.beginPath();
  const p1 = toScreen(xMin+0.1, slope*(xMin+0.1) + (ys[0] - slope*xs[0]));
  const p2 = toScreen(xMax-0.1, slope*(xMax-0.1) + (ys[0] - slope*xs[0]));
  chartCtx.moveTo(p1.x, p1.y); chartCtx.lineTo(p2.x, p2.y);
  chartCtx.strokeStyle = '#38bdf8';
  chartCtx.lineWidth = 1.5;
  chartCtx.stroke();

  // Points
  for (const r of results) {
    const p = toScreen(r.logInvEps, r.logN);
    chartCtx.beginPath();
    chartCtx.arc(p.x, p.y, 4, 0, Math.PI*2);
    chartCtx.fillStyle = '#f0abfc';
    chartCtx.fill();
  }

  // Labels
  chartCtx.fillStyle = '#7dd3fc';
  chartCtx.font = '9px monospace';
  chartCtx.fillText('log(1/ε)', cw/2 - 15, ch - 4);
  chartCtx.save();
  chartCtx.translate(10, ch/2);
  chartCtx.rotate(-Math.PI/2);
  chartCtx.fillText('log N(ε)', -20, 0);
  chartCtx.restore();

  chartCtx.fillStyle = '#38bdf8';
  chartCtx.font = '10px monospace';
  chartCtx.fillText(`D≈${slope.toFixed(3)}`, cw - 55, 20);
}

function drawGrid(epsilon) {
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += epsilon) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += epsilon) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function fullRender() {
  const W = canvas.parentElement.clientWidth;
  const H = Math.max(500, canvas.parentElement.clientHeight);
  canvas.width = W; canvas.height = H;
  drawFractal();
  currentGridSize = 32;
  if (showGrid) drawGrid(currentGridSize);
  updateAnalysis();
}

// UI wiring
document.getElementById('fractalSelect').addEventListener('change', e => {
  currentFractal = e.target.value;
  fullRender();
});

document.getElementById('iterSlider').addEventListener('input', e => {
  iterDepth = parseInt(e.target.value);
  document.getElementById('iterVal').textContent = iterDepth;
  fullRender();
});

document.getElementById('gridToggle').addEventListener('click', function() {
  showGrid = !showGrid;
  this.textContent = showGrid ? 'Hide Grid' : 'Show Grid';
  this.setAttribute('aria-pressed', showGrid);
  drawFractal();
  if (showGrid) drawGrid(currentGridSize);
});

document.getElementById('redrawBtn').addEventListener('click', fullRender);

window.addEventListener('resize', fullRender);
fullRender();
</script>
</body>
</html>
